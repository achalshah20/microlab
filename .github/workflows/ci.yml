# CPU-only CI.
#
# Everything in M0 except the gate training run is designed to be verifiable
# without a GPU, so correctness is checked on every push rather than whenever a
# Kaggle session happens to be free. GPU-only tests are marked `gpu` and skip
# here; they run on Kaggle via `pytest -m gpu`.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (CPU torch)
        # torch comes from the CPU index first so the job does not pull ~2.5 GB
        # of CUDA wheels it cannot use. Everything else resolves from the
        # package metadata, which is deliberately the only source of truth —
        # tests/test_packaging.py fails if src/ imports something undeclared.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Fast tests
        run: pytest -m "not slow and not gpu" -q

      - name: Preemption / session-chaining tests
        # These spawn real subprocesses and kill them with SIGTERM, so they are
        # slower and separated out — but they must run in CI, because they guard
        # the property M4's ~50-session run depends on.
        run: pytest -m slow -q

      - name: End-to-end pipeline smoke test
        # Prove the documented quickstart actually works from a clean checkout:
        # build a tokenizer and shards, train, and sample.
        run: |
          python -m microlab.cli prepare --source synthetic --out-dir data/synthetic \
            --vocab-size 1024 --val-fraction 0.05 --limit 8000
          python -m microlab.cli train m0_cpu train.max_steps=50 train.run_id=ci
          python -m microlab.cli sample m0_cpu train.run_id=ci --max-new-tokens 32
