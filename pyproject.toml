[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microlab"
version = "0.0.1"
description = "Training a language model from scratch on free-tier compute"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # torch is intentionally a floor, not a pin: the wheel must match the CUDA
    # driver of whatever free-tier box we land on. The exact version used for a
    # run is recorded in the run record, and docs/COMPUTE.md lists the versions
    # each provider ships.
    "torch>=2.4",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "regex>=2023.0",
]

[project.optional-dependencies]
# ruff is pinned exactly, not floored. A linter that floats between the
# developer's machine and CI produces failures that cannot be reproduced
# locally — which is precisely what happened on the first CI run of this repo.
dev = ["pytest>=7.4", "ruff==0.16.2"]

[project.scripts]
microlab = "microlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: tests that train for more than a few seconds",
    "gpu: tests that require CUDA",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# Tell ruff where first-party code lives. Without this it infers package
# ownership from the working directory, so an editable install resolves
# `microlab` as first-party locally but third-party on a CI runner — and the
# two disagree about import order in exactly the files that import both
# `microlab` and a third-party package.
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741"]

[tool.ruff.lint.isort]
# Belt and braces with `src` above: state the first-party package explicitly so
# classification does not depend on install state or ruff's inference at all.
known-first-party = ["microlab"]
